<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UAV Companion</title>
<meta name="description" content="Open-source map of suitable-flight (适飞) drone zones, starting with Hubei, China. Not flight advice: check UOM before every flight.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%232aa6b8'/%3E%3C/svg%3E">
<meta name="theme-color" content="#ffffff">
<script>/* theme before first paint: same rule as resolveTheme in src/theme.js */try{var t=JSON.parse(localStorage.getItem('uavzones.v1.prefs')||'{}').theme;document.documentElement.dataset.theme=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}catch(e){}</script>
<script type="module" src="/src/main.js"></script>
</head>
<body>
<div id="map"></div>

<!-- include: search.html -->

<!-- the rail shown while the panel is collapsed: < brings the panel back, each icon opens it on that tab -->
<!-- include: dock.html -->

<!-- include: panel.html -->

<!-- parts that the dashboard shows while it is open; they wait here otherwise -->
<div id="keystore" hidden>
  <div id="regions-note" class="hint">Loading regions…</div>
  <div id="legend" class="legend"></div>
</div>
<div id="datastore" hidden>
  <button type="button" class="btn" id="poi-export">Export GeoJSON</button>
  <button type="button" class="btn" id="poi-import">Import…</button>
  <button type="button" class="btn" id="poi-share" title="Copy a link that carries your markers, to open on another device">Copy share link</button>
  <input type="file" id="poi-file" accept=".geojson,.json,application/geo+json,application/json" hidden>
  <p class="hint" id="poi-note"></p>
</div>
<div class="wx" id="weather" hidden aria-live="polite"></div>
<div class="banner" id="banner" hidden role="status"><span id="banner-text"></span><button type="button" class="btn small" id="banner-review" hidden>Review</button><button type="button" class="btn small" id="banner-action">Cancel</button></div>
<!-- include: dashboard.html -->

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
