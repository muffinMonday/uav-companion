<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Motor bench test (developer prototype, not shipped)</title>
<style>
  :root { --bg: #fff; --fg: #1b1b1b; --muted: #555; --line: #888; --warn: #9a6700; --bad: #b42318; --ok: #1a7f37; --panel: #f4f4f4; --accent: #0b5cad; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121212; --fg: #eee; --muted: #b5b5b5; --line: #777; --warn: #e3b341; --bad: #ff7b72; --ok: #56d364; --panel: #222; --accent: #79b8ff; } }
  * { box-sizing: border-box; }
  body { font: 16px/1.45 system-ui, sans-serif; margin: 0 auto; max-width: 54rem; padding: 1rem 16px 7rem; color: var(--fg); background: var(--bg); overflow-wrap: anywhere; }
  button, select, input[type=text] { font: inherit; min-height: 44px; max-width: 100%; }
  button { padding: 0 1rem; margin: .25rem .25rem .25rem 0; cursor: pointer; }
  input[type=checkbox] { width: 22px; height: 22px; vertical-align: middle; }
  label { display: block; margin: .4rem 0; }
  h1 { font-size: 1.35rem; margin: 0 0 .5rem; } h2 { font-size: 1.1rem; }
  .bt-banner { border: 2px solid var(--warn); border-radius: 8px; padding: .5rem .75rem; margin-bottom: 1rem; }
  .bt-mode { font-weight: 700; padding: .4rem .6rem; border-radius: 6px; border: 3px solid currentColor; }
  .bt-mock { color: var(--accent); } .bt-real { color: var(--bad); }
  .bt-small { font-size: .85rem; color: var(--muted); }
  .bt-section, .bt-esc, .bt-inject { border: 1px solid var(--line); border-radius: 6px; margin: 1rem 0; padding: .5rem .75rem; }
  .bt-stateline { font: 600 .8rem/1 ui-monospace, monospace; color: var(--muted); }
  .bt-primary { border: 2px solid var(--accent); font-weight: 600; }
  .bt-note { border-left: 4px solid var(--warn); padding-left: .5rem; }
  .bt-warn { color: var(--warn); font-weight: 600; }
  .bt-done { color: var(--ok); }
  .bt-proof { list-style: none; padding: 0; }
  .bt-quad { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; max-width: 26rem; }
  .bt-cell { min-height: 64px; border: 2px solid var(--line); border-radius: 8px; margin: 0; }
  .bt-selected { border-color: var(--accent); outline: 4px solid var(--accent); font-weight: 700; }
  .bt-holdbtn { position: relative; overflow: hidden; min-height: 56px; border: 2px solid var(--accent); border-radius: 8px; }
  .bt-holdbar { position: absolute; left: 0; bottom: 0; height: 6px; width: 0; background: var(--accent); }
  .bt-hold { margin: .5rem 0; }
  .bt-holdstatus { display: block; min-height: 1.2em; font-size: .85rem; }
  .bt-readout { display: grid; grid-template-columns: max-content 1fr; gap: .25rem 1rem; font-size: 1.1rem; }
  .bt-readout dt { color: var(--muted); } .bt-readout dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 700; }
  pre { overflow: auto; max-height: 16rem; background: var(--panel); padding: .5rem; }
  .bt-stopwrap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2000; padding: .5rem 16px calc(.5rem + env(safe-area-inset-bottom)); display: flex; justify-content: center; pointer-events: none; }
  .bt-stop { pointer-events: auto; background: #c00; color: #fff; border: 3px solid #fff; border-radius: 10px; font-size: 1.4rem; font-weight: 800; min-height: 64px; min-width: min(100%, 20rem); box-shadow: 0 0 0 3px #c00, 0 4px 16px rgba(0,0,0,.5); }
  .bt-overlay { position: fixed; inset: 0; z-index: 1000; overflow: auto; background: #7a0d06; color: #fff; padding: 1.5rem 16px 8rem; }
  .bt-overlay button { background: #fff; color: #111; border: 2px solid #111; }
  .bt-fault-title { font-size: 2.2rem; line-height: 1.15; margin: .5rem 0 1rem; }
  .bt-overlay .bt-warn { color: #ffd479; }
  .bt-overlay .bt-done { color: #8df0a0; }
  .disabled-note { border: 2px solid var(--bad); padding: .75rem; }
</style>
</head>
<body>
<div id="bench"></div>
<p class="bt-small" id="bench-status" role="status"></p>
<script type="module" src="./lab.js"></script>
</body>
</html>
