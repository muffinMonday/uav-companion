<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Motor diagnostics lab (read-only, not shipped)</title>
<style>
  body { font: 16px/1.45 system-ui, sans-serif; margin: 0 auto; max-width: 52rem; padding: 1rem 16px 4rem; color: #1b1b1b; background: #fff; }
  button, select, input[type=text] { font: inherit; min-height: 44px; }
  button { padding: 0 1rem; }
  .pf-gates { list-style: none; padding: 0; }
  .pf-gate { border: 1px solid #888; border-radius: 6px; padding: .5rem .75rem; margin: .4rem 0; }
  .pf-gate-head { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .pf-badge { margin-left: auto; border: 1px solid currentColor; border-radius: 4px; padding: 0 .4rem; }
  .pf-pass { border-left: 6px solid #1a7f37; } .pf-warn { border-left: 6px solid #9a6700; }
  .pf-fail { border-left: 6px solid #b42318; } .pf-unknown { border-left: 6px solid #555; }
  .pf-hw { font-size: .85rem; border: 1px dashed #555; border-radius: 4px; padding: 0 .3rem; }
  fieldset, .pf-inventory, .spike { border: 1px solid #aaa; border-radius: 6px; margin: 1rem 0; padding: .75rem; }
  label { display: block; margin: .4rem 0; }
  pre { overflow: auto; max-height: 16rem; background: #f4f4f4; padding: .5rem; }
  .disabled-note { border: 2px solid #b42318; padding: .75rem; }
  @media (prefers-color-scheme: dark) { body { background: #121212; color: #eee; } pre { background: #222; } }
</style>
</head>
<body>
<h1>Motor diagnostics lab</h1>
<p>Read-only. Not part of the shipped app. It never sends a motor command, a configuration write or a CLI line.</p>
<div id="lab"></div>
<script type="module">import { mountSpike } from "./spike.js"; mountSpike(document.getElementById("lab"));</script>
</body>
</html>
