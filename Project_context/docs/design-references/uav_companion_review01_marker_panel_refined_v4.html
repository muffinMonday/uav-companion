function completeMode(){const m=state.activeMode;endMode();if(m==='inspect')openOverlay('pointCheck');else if(m==='meeting')openOverlay('sessionWizard');else if(m==='placement')openOverlay('markerWizard');else if(m==='move')openOverlay('marker');toast('Sample point selected; no coordinates were saved')}
function openOverlay(name,type){state.overlay=name;state.overlayType=type||(['search','tripDetail','sessionDetail','settings','diagnostics','achievements','xpHistory','friends','help','profileEdit','tripWizard','sessionWizard','import','data','tripManage','sessionManage'].includes(name)?'full':['auth','confirm','cloudConflict','publicConfirm','deleteAccount'].includes(name)?'dialog':'sheet');state.sheetSize=['marker','pointCheck'].includes(name)?'compact':'medium';renderOverlay()}
function closeOverlay(force=false){if(state.dirty&&!force){openConfirm('Discard unsaved changes?','The current form has edits. Leave without saving?',()=>{state.dirty=false;closeOverlay(true)});return}state.overlay=null;$('scrim').classList.add('hidden');$('overlayHost').innerHTML=''}
function dismissOverlay(){closeOverlay()}
function resizeSheet(){state.sheetSize=state.sheetSize==='compact'?'medium':state.sheetSize==='medium'?'expanded':'compact';renderOverlay()}
function openConfirm(title,desc,onYes){state.returnOverlay=state.overlay;state.confirmAction=onYes;state.confirmTitle=title;state.confirmDesc=desc;state.overlay='confirm';state.overlayType='dialog';renderOverlay()}
function confirmYes(){const fn=state.confirmAction;state.confirmAction=null;state.dirty=false;closeOverlay(true);if(fn)fn()}
function renderOverlay(){const name=state.overlay;if(!name){closeOverlay(true);return}const full=state.overlayType==='full',dialog=state.overlayType==='dialog';$('scrim').classList.remove('hidden');const cls=full?'fullview':dialog?'modalbox':`sheet ${state.sheetSize} ${name==='marker'?'marker-detail-sheet':''}`;let content=overlayContent(name);let header=`<div class="headrow" style="margin-bottom:12px"><h2 style="margin:0">${name==='marker'?'Marker details':overlayTitle(name)}</h2><div class="row">${!full&&!dialog?button('↕','resizeSheet()','iconbtn'):''}${button('×','closeOverlay()','iconbtn')}</div></div>`;$('overlayHost').innerHTML=`<div class="${cls}" ${dialog?'role="presentation"':''}>${dialog?'<div class="modal" role="dialog" aria-modal="true" aria-label="'+overlayTitle(name)+'">':''}${!full&&!dialog?'<div class="handle"></div>':''}${header}${content}${dialog?'</div>':''}</div>`}
function overlayTitle(n){return ({marker:state.marker,pointCheck:'Point inspection',places:'Saved places',layers:'Map layers',search:'Search',markerWizard:'Add a marker',move:'Move marker',bulk:'Manage saved places',route:'Route summary',tripDetail:state.trip,tripWizard:'Create trip',tripManage:'Manage trip',sessionDetail:'Weekend FPV Meetup',sessionWizard:'Host a flight session',sessionManage:'Manage session',activity:'Activity inbox',settings:'Settings',auth:'Sign in',confirm:state.confirmTitle,cloudConflict:'Sync conflict',diagnostics:'Motor diagnostics',achievements:'Achievements',xpHistory:'XP history',friends:'Friends',help:'Help & onboarding',profileEdit:'Edit profile',import:'AI itinerary import',data:'Data management',publicConfirm:'Public session visibility',deleteAccount:'Delete account'})[n]||n}
function overlayContent(n){switch(n){
case 'search':return `<input class="field" aria-label="Search places, coordinates or regions" placeholder="Search places, coordinates or regions" oninput="$('searchResult').textContent=this.value?'Sample results for: '+this.value:'Search online or select a supported region'"/><div class="eyebrow">Supported regions</div><div class="scrollchips">${button('Singapore',"toast('Map would fit Singapore coverage');closeOverlay(true)",'chip')}${button('China ▾',"toast('Country and region buttons remain separate')",'chip')}${button('Other regions',"toast('Only supported coverage is selectable')",'chip')}</div><p id="searchResult" class="muted small">Search online or select a supported region.</p><div class="info">Coordinates and map links are parsed locally. Online place search remains separate from supported-region navigation.</div>`;
case 'layers':return `<h3>Visibility</h3>${toggle('Flight zones',state.layerZones,'state.layerZones=this.checked')}${toggle('Saved markers',state.layerMarkers,'state.layerMarkers=this.checked')}${toggle('Flight Session markers',state.layerSessions,'state.layerSessions=this.checked')}<label>Zone opacity <strong id="opacityLabel">${state.zoneOpacity}%</strong><input type="range" class="field" min="10" max="90" value="${state.zoneOpacity}" oninput="state.zoneOpacity=this.value;$('opacityLabel').textContent=this.value+'%'"/></label><label>Basemap<select class="field"><option>OpenStreetMap</option><option>Humanitarian</option><option>CyclOSM</option><option>OpenTopoMap</option></select></label><div class="info warn">Map coloring is informational, not flight authorization. Check current official restrictions before every flight.</div>${button('Full map settings',"openOverlay('settings')")}`;
case 'marker':return `<div class="marker-detail-body"><div class="marker-identity"><div class="marker-icon" aria-hidden="true">${state.marker==='Riverside Camp'?'⌂':state.marker.includes('Quest')?'★':'✦'}</div><div class="marker-heading"><h3>${escapeHTML(state.marker)}</h3><p class="muted small">${state.marker==='Riverside Camp'?'Accommodation':state.marker.includes('Quest')?'Side Quest':'Saved flying place'} · Lake District FPV · Day ${state.day}</p></div></div><div class="marker-meta"><span class="tag">Trip stop</span><span class="tag">Day ${state.day}</span></div><p class="marker-warning"><span aria-hidden="true">!</span> Airspace not verified. Check official sources before flying.</p><div class="marker-actions">${button('➤ Navigate',"toast('External navigation not launched')",'btn primary')}${button('Details','resizeSheet()','btn')}${state.sheetSize!=='compact'?button('Route to',"openOverlay('route')",'btn'):''}</div>${state.sheetSize!=='compact'?`<div class="marker-extra"><h4>Location information</h4><p class="small muted">Example coordinates · Trip stop on Day ${state.day}</p><p class="small">Notes, photos, weather and elevation appear here only when available. No live zone check is performed in this prototype.</p><div class="actions">${button('Route to',"openOverlay('route')")}${button('Edit',"openOverlay('markerWizard')")}${button('Move location',"beginMode('move')")}</div></div>`:''}</div>`;
case 'pointCheck':return `<span class="tag warn">Not a flight permission verdict</span><p>Sample location · 1.3521° N, 103.8198° E</p><div class="info warn">No official airspace dataset is queried in this prototype. A check is not saved automatically.</div><div class="actions">${button('Add as marker',"openOverlay('markerWizard')",'btn primary')}${button('Inspect another point',"beginMode('inspect')")}</div>`;
case 'places':return `<div class="row"><input class="field grow" placeholder="Search saved places" aria-label="Search saved places" value="${escapeHTML(state.placesSearch)}" oninput="state.placesSearch=this.value;renderPlaceRows()"/>${button('＋',"openOverlay('markerWizard')",'iconbtn')}</div><div class="scrollchips">${['All','Trip stops','Unassigned','Home','Side Quests'].map(x=>button(x,`state.placesFilter='${x}';renderOverlay()`, 'chip '+(state.placesFilter===x?'active':''))).join('')}</div><div id="placeRows">${placeRows()}</div><div class="actions">${button('Add marker',"openOverlay('markerWizard')",'btn primary')}${button('Select / manage',"openOverlay('bulk')")}</div>`;
case 'markerWizard':return wizard('marker');
case 'bulk':return `<p class="muted small">Selection mode · The list and actions remain available without dragging.</p>${['Lakeside Launch','Riverside Camp','Scenic Side Quest'].map(x=>`<label class="toggle">${x}<input type="checkbox" onchange="this.closest('label').classList.toggle('active',this.checked)"/></label>`).join('')}<div class="actions">${button('Select all',"toast('Selection preview only')")}${button('Reassign trip',"toast('Bulk reassignment preview')")}${button('Export first',"toast('No files exported in prototype')")}${button('Delete',"openConfirm('Delete selected markers?','Selected markers would be permanently removed. Export first if you need a backup.',()=>toast('Demo: nothing deleted'))",'btn danger')}</div>`;
case 'route':return `<span class="tag">Driving route · demo</span><p>Road distance and straight-line references are separate. Routes may be pending, cached, unavailable or straight-line fallback.</p><div class="card">${item('↝','Leg 1','Road route · example only','')}${item('⋯','Leg 2','Fallback · routing unavailable','')}</div><div class="info warn">Do not interpret a dashed straight line as a road route. Existing route renderer, cache and provider semantics remain authoritative.</div>${button('Return to map',"closeOverlay(true)",'btn primary')}`;
case 'tripDetail':return `<div class="hero"><div class="eyebrow" style="color:#b8e8e2">Upcoming · shared</div><h1>${state.trip}</h1><p>24–28 Nov 2026 · 5 days · 12 stops</p>${button('Show on map',"switchTab('map');toast('Trip/day preserved; map fit is conceptual')",'btn primary')}</div><div class="scrollchips">${[1,2,3,4,5].map(d=>button('Day '+d,`state.day=${d};renderOverlay()`,'chip '+(state.day===d?'active':''))).join('')}</div><h3>Day ${state.day} itinerary</h3><div class="timeline">${item('✦','Lakeside Launch','Main stop · 14:00',"switchTab('map');selectMarker('Lakeside Launch')")}${item('⌂','Riverside Camp','Accommodation · overnight',"switchTab('map');selectMarker('Riverside Camp')")}${item('★','Scenic Side Quest','Optional extra stop',"switchTab('map');selectMarker('Scenic Side Quest')")}</div><div class="info warn">Trip warnings: undated stops, missing accommodation and zone checks must remain visible.</div><div class="actions">${button('Route',"openOverlay('route')")}${button('Add stop',"openOverlay('markerWizard')")}${button('Members',"openOverlay('tripManage')")}${button('More',"openOverlay('tripManage')")}</div>`;
case 'tripManage':return `${item('♙','Members & sharing','Permissions, invitations and ownership',"toast('Shared-trip permissions remain server-controlled')")}${item('✎','Edit trip','Dates, description and destination',"openOverlay('tripWizard')")}${item('↧','Import itinerary','Preview before importing',"openOverlay('import')")}<div class="info warn">Deleting an owned shared trip affects every member. Leaving a shared trip is a different action.</div>${button('Delete or leave trip',"openConfirm('Delete or leave this trip?','A personal trip leaves markers unassigned; an owned shared trip affects the entire party.',()=>toast('Demo: no trip changed'))",'btn danger')}`;
case 'tripWizard':return wizard('trip');
case 'sessionDetail':return `<span class="tag">Upcoming · illustrative</span><h1>Weekend FPV Meetup</h1><p>Saturday · 09:00–12:00 · Example meeting point</p>${item('♙','Host profile','Open full host profile',"toast('Host profile preview')")}${item('♧','Participants','Capacity, attendance and privacy',"toast('Participant list preview')")}${item('🏅','XP eligibility','Server-defined reward and host rules',"toast('XP rules are not hardcoded')")}<div class="info warn">Public session coordinates may be visible to everyone. Attendance and XP remain server-authoritative.</div><div class="actions">${button('Join session',"state.guest?openOverlay('auth'):toast('Demo: RSVP not submitted')",'btn primary')}${button('View on map',"switchTab('map');toast('Session context preserved')")}${button('Host tools',"openOverlay('sessionManage')")}</div>`;
case 'sessionManage':return `<h3>Host and participant actions</h3>${item('♧','Invitations','Invite or review participants',"toast('No invitation sent')")}${item('✓','Attendance','Manual confirmation and server XP rules',"toast('Attendance not changed')")}${item('⚑','Moderation','Reports, cancellations and notices',"toast('No moderation action performed')")}<div class="info warn">Automatic attendance remains disabled unless separately enabled by authorized backend configuration.</div>`;
case 'sessionWizard':return wizard('session');
case 'activity':return `<div class="scrollchips">${['All','Action needed','Updates'].map(x=>button(x,`state.noticeTab='${x}';renderOverlay()`,'chip '+(state.noticeTab===x?'active':''))).join('')}</div>${item('♙','Friend request','Pending action · example',"openOverlay('friends')")}${item('▦','Trip invitation','Shared trip · example',"openOverlay('tripDetail')")}${item('◷','Session invitation','Review flight session',"openOverlay('sessionDetail')")}${item('☁','Sync needs attention','Review local and cloud copies',"openOverlay('cloudConflict')")}<div class="info">Badge indicates items needing attention, not a fabricated unread count. Sources can fail independently.</div>`;
case 'settings':return `${['Map & display','Units & navigation','Privacy & location','Account & sync','Data management','Help & about'].map((x,i)=>`<details class="card"><summary><strong>${x}</strong></summary>${settingsSection(i)}</details>`).join('')}`;
case 'auth':return `<p class="muted small">Sign in to sync trips, connect with friends and participate in shared features.</p>${button('Continue with Google',"toast('Demo only: no OAuth request')",'btn primary')}<p class="muted small">or use email</p><label>Email<input type="email" class="field" placeholder="you@example.com"/></label>${button('Send sign-in link',"toast('Demo only: no email sent')")}<p class="small muted">Continue as guest to use local map and trip features.</p>`;
case 'cloudConflict':return `<div class="info warn">This device and your cloud copy differ. Choose carefully; never overwrite silently.</div>${button('Download device backup',"toast('Demo only: no backup downloaded')")}${button('Download cloud backup',"toast('Demo only: no backup downloaded')")}<div class="actions">${button('Keep this device',"toast('Demo: no sync changed')")}${button('Keep cloud copy',"toast('Demo: no sync changed')")}</div>`;
case 'confirm':return `<p>${escapeHTML(state.confirmDesc)}</p><div class="actions">${button('Cancel',"closeOverlay(true)")}${button('Confirm',"confirmYes()",'btn danger')}</div>`;

case 'achievements':return `<p class="muted small">Three featured achievements; collection supports locked/unlocked states and accessible explanations.</p>${['Explorer','Community Pilot','Trip Planner','Flight Session Host','Waypoint Collector'].map((x,i)=>item(i<3?'🏅':'◇',x,i<3?'Unlocked · featured':'Locked · how to earn',"toast('Achievement preview')")).join('')}`;
case 'xpHistory':return `${item('＋','Example activity','XP awarded by server, not by this mockup','')}${item('↗','Session participation','Reward details and timestamp','')}<div class="info">History is paginated. Errors must not be displayed as zero XP.</div>`;
case 'friends':return `${item('♙','Friend requests','Review, accept or decline',"toast('No request changed')")}${item('♧','Friends list','Profile, invitations, sharing',"toast('Friend profile preview')")}<div class="info">Adding a friend does not automatically share your location.</div>`;
case 'help':return `<h3>Choose how to begin</h3>${item('▱','Explore the map','Inspect a location and view official source information',"switchTab('map')")}${item('▦','Plan a trip','Organize markers, accommodation and routes',"switchTab('trips')")}${item('◈','Discover flight sessions','Browse public sessions as a guest',"switchTab('explore')")}<div class="info warn">Map colors are information, not permission to fly. Always check official sources.</div>${button('Continue as guest',"state.guest=true;switchTab('map');toast('Guest mode: map opened')",'btn primary')}`;

case 'publicConfirm':return `<div class="info warn">Anyone, including guests, can see the exact meeting point for a public session.</div><label class="toggle">I understand the exact point is public<input type="checkbox"/></label>${button('Continue',"openOverlay('sessionWizard')",'btn primary')}`;

function toggle(label,checked,handler){return `<label class="toggle">${label}<input type="checkbox" ${checked?'checked':''} onchange="${handler}"/></label>`}
function placeRows(){const arr=[['✦','Lakeside Launch','Lake District FPV · Day 1','Trip stops'],['⌂','Riverside Camp','Lake District FPV · Day 1','Trip stops'],['★','Scenic Side Quest','Day 1 · Optional stop','Side Quests'],['⌂','Private Home','Unassigned · Private','Home']];const q=state.placesSearch.toLowerCase();const shown=arr.filter(x=>(state.placesFilter==='All'||x[3]===state.placesFilter||(state.placesFilter==='Unassigned'&&x[3]==='Home'))&&x.join(' ').toLowerCase().includes(q));return shown.length?shown.map(x=>item(x[0],x[1],x[2],`closeOverlay(true);selectMarker('${x[1]}')`)).join(''):'<div class="card"><strong>No matching places</strong><p class="muted small">Your markers are unchanged. Clear filters to see them again.</p></div>'}
function renderPlaceRows(){const e=$('placeRows');if(e)e.innerHTML=placeRows()}
function wizard(type){state.formType=type;const steps=type==='marker'?['Type','Trip','Location','Review']:type==='trip'?['Basics','Dates','Review']:['Basics','Schedule','Location','Publish'];const step=Math.min(state.formStep,steps.length-1);let fields='';if(type==='marker'){fields=[`<label>Marker type<select class="field"><option>Flying spot</option><option>Accommodation</option><option>Waypoint</option><option>Side Quest</option><option>Home</option></select></label>`,`<label>Trip<select class="field"><option>No trip</option><option>Lake District FPV</option></select></label><p class="small muted">Home markers cannot be assigned to a trip; Side Quests require a valid parent where applicable.</p>`,`<p>Choose a location using the map, map center or current location.</p>${button('Choose on map',"beginMode('placement')")}${button('Use map center',"toast('Sample center selected')")}`,`<label>Name<input class="field" placeholder="Marker name" oninput="state.dirty=true"/></label><p class="muted small">Review the type, trip and coordinates before saving.</p>`][step]}else if(type==='trip'){fields=[`<label>Trip name<input class="field" placeholder="Trip name" oninput="state.dirty=true"/></label><label>Country (optional)<input class="field" placeholder="Country"/></label>`,`<label>Start date<input class="field" type="date"/></label><label>End date<input class="field" type="date"/></label><label>Description<textarea class="field"></textarea></label>`,`<div class="info">Review the trip details. Existing saved markers are not modified automatically.</div>`][step]}else{fields=[`<label>Title<input class="field" placeholder="Flight Session title" oninput="state.dirty=true"/></label><label>Description<textarea class="field"></textarea></label>`,`<label>Date<input class="field" type="date"/></label><label>Start<input class="field" type="time"/></label><label>End<input class="field" type="time"/></label><label>Repeat<select class="field"><option>Does not repeat</option><option>Weekly</option><option>Monthly</option></select></label>`,`<p>Choose the meeting point on the map, map center or from a saved marker.</p>${button('Pick on map',"beginMode('meeting')")}`,`<label>Visibility<select class="field" id="sessionVisibility"><option value="private">Private</option><option value="public">Public</option></select></label><label>Capacity<input class="field" type="number" min="1" max="500" placeholder="No limit"/></label><div class="info warn">Public sessions reveal exact meeting coordinates. An explicit acknowledgement is required.</div>`][step]}return `<div class="scrollchips">${steps.map((x,i)=>`<span class="chip ${i===step?'active':''}">${i+1}. ${x}</span>`).join('')}</div>${fields}<div class="actions">${step?button('Back',"state.formStep--;renderOverlay()"):button('Cancel',"closeOverlay()")}${step===steps.length-1?button('Review / finish',type==='session'?"openOverlay('publicConfirm')":"state.dirty=false;closeOverlay(true);toast('Demo only: no data saved')",'btn primary'):button('Next',"state.formStep++;state.dirty=true;renderOverlay()",'btn primary')}</div><p class="previewnotice">Draft preview only. The real application will enforce field validation and appropriate persistence.</p>`}
function settingsSection(i){return [toggle('Show flight zones',true,'toast("Display preview")')+toggle('Show completed trips',false,'toast("Display preview")')+`<label>Theme<select class="field"><option>System</option><option>Light</option><option>Dark</option></select></label>`,`<label>Map provider<select class="field"><option>Automatic</option><option>Google Maps</option><option>Amap (China)</option></select></label><label>Distance units<select class="field"><option>Metric</option><option>Imperial</option></select></label>`,toggle('Locate on launch',true,'toast("Local preference demo")')+toggle('Automatic weather lookup',false,'toast("Requires separate consent")')+toggle('Ground elevation lookup',false,'toast("Precise coordinates disclosed")')+toggle('Automatic live sharing',false,'toast("Consent required")')+toggle('Automatic session attendance',false,'toast("Backend flag remains authoritative")')+`<div class="info warn">Weather, elevation, live sharing and attendance are independent permissions.</div>`,button('Sign in',"openOverlay('auth')")+button('Cloud copy conflict',"openOverlay('cloudConflict')"),button('Import / export',"openOverlay('data')")+button('Delete account',"openOverlay('deleteAccount')",'btn danger'),button('Help & onboarding',"openOverlay('help')")+`<p class="small muted">Version and source attribution would appear here.</p>`][i]}
function diagnostics(){const steps=['Connect','Readiness','Safety checklist','Battery & zero','ESC identification','Restore','Motor tests','Stop verification','Results'];const idx=state.diagStep;return `<div class="info danger">EXPERIMENTAL UI CONCEPT — no hardware access, motor commands, firmware writes or physical safety claims.</div><div class="card"><div class="eyebrow">Step ${idx+1} of 9</div><h2>${steps[idx]}</h2><div class="progress"><div style="width:${(idx+1)/9*100}%"></div></div></div><div class="card">${item('⌁','Flight controller','Not connected · simulated display only','')}${item('⚑','Readiness evidence','Blocked / Check / Passed / Not confirmed','')}${item('◇','ESC information','Model, firmware and version where available','')}${item('⊙','Motor state','Actual direction must be visually verified; no inferred direction claim','')}</div><div class="info warn">Controller state, interlocks, Stop & zero and lifecycle protection remain authoritative. This demo cannot validate real hardware.</div><div class="actions">${button('Previous',"state.diagStep=Math.max(0,state.diagStep-1);renderOverlay()")}${button('Next visual step',"state.diagStep=Math.min(8,state.diagStep+1);renderOverlay()",'btn primary')}</div><div class="diagstop">${button('Stop & zero (disabled demo)',"toast('No hardware or motor command available')",'btn danger')}<p class="tiny muted">This visual button is intentionally non-operational.</p></div>`}
function renderDestinations(){const trips=$('trips'),explore=$('explore'),profile=$('profile');trips.innerHTML=`<div class="featurebar"><h1>My trips</h1>${button('＋',"state.formStep=0;openOverlay('tripWizard')",'iconbtn')}</div><div class="hero"><div class="eyebrow" style="color:#b7e8e2">NEXT ADVENTURE</div><h2>Lake District FPV</h2><p>24–28 November 2026 · 5 days</p><div class="statgrid"><div class="stat"><strong>5</strong><small>Days</small></div><div class="stat"><strong>12</strong><small>Stops</small></div><div class="stat"><strong>3</strong><small>Members</small></div></div><div class="actions">${button('Open itinerary',"openOverlay('tripDetail')",'btn primary')}${button('Show on map',"switchTab('map')")}</div></div><div class="headrow"><h2>All trips</h2><div class="scrollchips">${['All','Upcoming','Shared','Past'].map(x=>button(x,`state.tripFilter='${x}';renderDestinations()`,'chip '+(state.tripFilter===x?'active':''))).join('')}</div></div>${['Lake District FPV','Coastal Run','Alpine Summer'].filter((x,i)=>state.tripFilter==='All'||(state.tripFilter==='Shared'&&i===0)||(state.tripFilter==='Upcoming'&&i<2)||(state.tripFilter==='Past'&&i===2)).map((x,i)=>`<div class="card"><div class="tripphoto">${i===0?'Shared trip':i===1?'Upcoming':'Past trip'}</div><h2>${x}</h2><p class="small muted">${i===0?'24–28 Nov 2026':i===1?'12–14 Dec 2026':'16–23 Jul 2026'} · Example itinerary</p><div class="actions">${button('Open',`state.trip='${x}';openOverlay('tripDetail')`,'btn primary')}${button('More',`state.trip='${x}';openOverlay('tripManage')`)}</div></div>`).join('')}${button('AI itinerary import',"openOverlay('import')")}`;
explore.innerHTML=`<div class="featurebar"><h1>Explore</h1>${button('Host ＋',"state.formStep=0;openOverlay('sessionWizard')",'btn primary')}</div><div class="scrollchips">${['Discover','My Sessions','Invitations'].map(x=>button(x,`state.exploreTab='${x}';renderDestinations()`,'chip '+(state.exploreTab===x?'active':''))).join('')}</div>${state.exploreTab==='Discover'?`<input class="field" placeholder="Search flight sessions" aria-label="Search flight sessions" oninput="state.sessionSearch=this.value"/><div class="scrollchips">${['Today','Upcoming','Nearby','Has space'].map(x=>button(x,`state.sessionFilter='${x}';renderDestinations()`,'chip '+(state.sessionFilter===x?'active':''))).join('')}</div><div class="card"><div class="row between"><span class="tag">${state.sessionFilter}</span><span class="small muted">Example event</span></div><h2>Weekend FPV Meetup</h2><p class="small muted">Saturday · 09:00–12:00 · Sample location</p>${item('♙','Host profile','Tap to view pilot profile',"toast('Host profile demo')")}${item('🏅','XP eligibility','Server-defined reward; no hardcoded XP','')}<div class="actions">${button('Details',"openOverlay('sessionDetail')",'btn primary')}${button('Map preview',"switchTab('map');toast('Map explorer preview')")}</div></div><div class="info">Map previews load on demand. Public sessions remain browseable by guests; account actions require sign-in.</div>`:state.exploreTab==='My Sessions'?`<div class="card"><h2>My Sessions</h2><p class="muted">Hosted, joined and historical sessions, with attendance and management states.</p>${button('View example session',"openOverlay('sessionDetail')",'btn primary')}</div>`:`<div class="card"><h2>Session invitations</h2><p class="muted">Private invitations and action-needed states.</p>${button('Open invitation',"openOverlay('sessionDetail')",'btn primary')}</div>`}`;
profile.innerHTML=`<div class="featurebar"><h1>Pilot profile</h1>${button('Edit',"openOverlay('profileEdit')",'iconbtn')}</div><div class="hero"><div class="row"><div style="font-size:45px">🛩</div><div><div class="eyebrow" style="color:#a5e9e2">PILOT IDENTITY · EXAMPLE</div><h2>Explorer</h2><p class="small">Rank · Tier · Pilot progression</p></div></div><p class="small">Progress to next rank</p><div class="progress"><div></div></div><p class="small">Illustrative only · XP from server</p></div><div class="headrow"><h2>Featured achievements</h2>${button('View all',"openOverlay('achievements')",'btn small')}</div><div class="statgrid"><div class="stat"><strong>🏅</strong><small>Explorer</small></div><div class="stat"><strong>★</strong><small>Community</small></div><div class="stat"><strong>◇</strong><small>Planner</small></div></div><div class="card">${item('♙','Friends','Requests, profiles and sharing',"openOverlay('friends')")}${item('♧','Activity inbox','Invitations and attention items',"openOverlay('activity')")}${item('◷','XP history','Server-backed progression history',"openOverlay('xpHistory')")}${item('⚙','Motor diagnostics','Experimental safety-focused workspace',"openOverlay('diagnostics')")}${item('☁','Account & sync','Sign in, backups and conflict handling',"openOverlay('auth')")}</div><div class="info">Guest users see local data and sign-in options instead of invented progression values.</div>`}
renderDestinations();document.querySelectorAll('.previewbar button[data-size]').forEach(b=>b.addEventListener('click',()=>{const size=b.dataset.size;document.body.classList.toggle('preview-mode',size!=='auto');const app=$('app');if(size==='auto')app.removeAttribute('data-preview');else app.dataset.preview=size;document.querySelectorAll('.previewbar button[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.overlay)closeOverlay()});window.addEventListener('popstate',()=>{if(state.overlay)closeOverlay();else switchTab('map')});
</script></body></html>
