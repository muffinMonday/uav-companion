# Settings for the local Supabase stack (only used if it is ever started with "supabase start"). The hosted project is configured in its dashboard.
project_id = "uav-companion"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "https://muffinmonday.github.io/uav-companion/"]

[auth.email]
enable_signup = true
enable_confirmations = false

# The edge function that deletes an account (the platform checks the caller token first; the handler checks it again).
[functions.delete-account]
verify_jwt = true

# Steam linking and sync (progression phase 6). steam-link: the platform check is off because Steam redirects the browser back without a session; the function checks the session (POST) or a signed state (GET) itself.
[functions.steam-link]
verify_jwt = false

# A person's own Sync now: a signed-in session is required.
[functions.steam-sync]
verify_jwt = true

# The daily run, called by a scheduler with the x-cron-secret header.
[functions.steam-sync-all]
verify_jwt = false
