<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hubei suitable-flight zone overlay</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#ffffff;--fg:#1b2733;--muted:#5c6b7a;--line:#d3dce4;--accent:#1f7a8c;--zone:#2aa6b8}
@media (prefers-color-scheme: dark){:root{--bg:#16202a;--fg:#e6edf3;--muted:#9fb0bf;--line:#2c3b49;--accent:#5cc3d4;--zone:#2aa6b8}}
html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--fg)}
#map{position:absolute;inset:0}
.panel{position:absolute;z-index:1000;top:10px;right:10px;width:250px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.panel h1{font-size:14px;margin:0 0 8px;font-weight:600}
.panel label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.panel select,.panel input[type=range]{flex:1;min-width:0}
.panel small{color:var(--muted);display:block}
.nudge{display:grid;grid-template-columns:repeat(3,34px);gap:4px;justify-content:center;margin:8px 0 4px}
.nudge button,.panel .reset{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:4px;padding:4px;cursor:pointer;font:inherit}
.nudge button:hover,.panel .reset:hover{border-color:var(--accent)}
.nudge button:focus-visible,.panel .reset:focus-visible,.panel select:focus-visible,.panel input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nudge .n{grid-column:2}
.nudge .w{grid-column:1;grid-row:2}
.nudge .s{grid-column:2;grid-row:2}
.nudge .e{grid-column:3;grid-row:2}
.note{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.tog{position:absolute;z-index:1001;top:10px;right:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.tog:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.panel.hidden{display:none}
.panel h1{margin-right:92px}
.search{position:absolute;z-index:1002;top:10px;left:54px;width:min(320px,calc(100% - 170px))}
.search input{width:100%;box-sizing:border-box;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);box-shadow:0 1px 6px rgba(0,0,0,.2)}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.results{list-style:none;margin:4px 0 0;padding:4px 0;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 6px rgba(0,0,0,.2);max-height:50vh;overflow-y:auto}
.results[hidden]{display:none}
.results li{padding:6px 10px;cursor:pointer;line-height:1.3}
.results li[aria-selected=true],.results li:hover{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.results small{color:var(--muted);display:block}
.results .msg{cursor:default;color:var(--muted)}
.results .online{color:var(--accent);border-top:1px solid var(--line)}
@media (max-width:520px){.panel h1{margin-right:0}.panel{width:auto;left:10px;right:10px;top:auto;bottom:24px}}
</style>
</head>
<body>
<div id="map"></div>
<div class="search">
  <input id="q" type="search" placeholder="Search places (e.g. 宜昌, Wudang)" autocomplete="off" aria-label="Search places" role="combobox" aria-expanded="false" aria-controls="results">
  <ul class="results" id="results" role="listbox" hidden></ul>
</div>
<button class="tog" id="tog" aria-expanded="true" aria-controls="panel">Hide menu</button>
<div class="panel" id="panel">
  <h1>Hubei suitable-flight zone</h1>
  <label><span>Show zone</span><input type="checkbox" id="show" checked></label>
  <label><span>Opacity</span><input type="range" id="op" min="0.1" max="0.9" step="0.05" value="0.45"></label>
  <label><span>Basemap</span>
    <select id="base">
      <option value="esri" selected>Esri Streets</option>
      <option value="sat">Esri Satellite</option>
      <option value="topo">OpenTopoMap (OSM data)</option>
      <option value="osm">OpenStreetMap (needs http/https)</option>
    </select>
  </label>
  <div class="note">Official data: Hubei Development and Reform Commission grid, in effect from 14 May 2026. Blue = suitable-flight airspace below 120 m true height; everything else is controlled. Zones can change, so check UOM before every flight.</div>
</div>

const KIND = {city:'City', county:'District / county', landmark:'Landmark'};
const norm = t => t.toLowerCase().replace(/[\s'’\-]/g,'');
const strip = t => t.replace(/(土家族自治县|林区|市|区|县)$/,'');
const qEl = document.getElementById('q'), resEl = document.getElementById('results');
let items = [], sel = -1, marker = null;
function offline(q){
  const n = norm(strip(q.trim())); if (!n) return [];
  const out = [];
  for (const [zh,en,lat,lon,kind] of PLACES){
    const z = strip(zh), e = norm(en);
    let score = -1;
    if (z === n || e === n) score = 0;
    else if (z.startsWith(n) || e.startsWith(n)) score = 1;
    else if (zh.includes(n) || e.includes(n)) score = 2;
    if (score >= 0) out.push({score, label: zh, sub: en+' · '+KIND[kind], lat, lon, zoom: kind==='city'?11:kind==='county'?12:14});
  }
  return out.sort((a,b)=>a.score-b.score).slice(0,8);
}
function render(list, q){

    li.firstChild.textContent = it.label; li.lastChild.textContent = it.sub;

async function online(q){
