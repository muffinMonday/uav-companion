<section class="dash" id="dash" role="region" aria-label="Dashboard" hidden>
  <header class="dash-head">
    <h2>Dashboard</h2>
    <div class="dash-tools">
      <button type="button" class="icon-btn" id="dash-help" aria-label="How it works" aria-pressed="false" title="How it works"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 114 2c-.9.6-1.6 1.1-1.6 2.2M12 16.8v.1"/></svg></button>
      <button type="button" class="icon-btn dash-expand" id="dash-expand" aria-label="Expand the dashboard" aria-pressed="false" title="Expand the dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11l5-5 5 5M7 18l5-5 5 5"/></svg></button>
      <button type="button" class="icon-btn" id="dash-collapse" aria-label="Collapse the dashboard" title="Collapse"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <button type="button" class="icon-btn" id="dash-close" aria-label="Close the dashboard" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </header>
  <div class="dash-body" id="dash-body"></div>
  <footer class="dash-foot"><small class="dash-reminder">A planning aid, not flight advice.</small><button type="button" class="btn small" id="dash-snooze">Do not show for today</button></footer>
</section>
<button type="button" class="dash-peek" id="dash-peek" hidden aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg><span id="dash-peek-text">Dashboard</span></button>
<button type="button" class="icon-btn dash-tab" id="dash-tab" hidden aria-label="Open the dashboard" title="Open the dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
